name: expense_tracker
description: "A new Flutter project."
publish_to: 'none' # Private package

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.1.1
  get: ^4.6.6
  smooth_page_indicator: ^1.1.0   # onboarding dots
