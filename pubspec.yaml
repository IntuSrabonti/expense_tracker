  video_player: ^2.9.1            # ✅ for playing mp4 video (optional)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
   - assets/icons/Tm.png

